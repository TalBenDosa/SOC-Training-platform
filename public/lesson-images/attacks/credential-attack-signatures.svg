<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 560" role="img" aria-label="Table comparing four credential attacks - brute force, password spray, credential stuffing, and pass-the-hash - by accounts targeted, passwords tried, rate and shape, and the exact log signature each one leaves">
  <title>Four credential attacks compared by their log signature</title>
  <defs>
    <style>
      .bg    { fill: #0b0f1e; }
      .panel { fill: #0a1020; stroke: #1e2d4a; stroke-width: 1; }
      .hot   { fill: #0e1b30; stroke: #22d3ee; stroke-width: 1.5; }
      .ui    { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; }
      .mono  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; }
      .val   { fill: #e2e8f0; font-size: 11px; }
      .dim   { fill: #64748b; font-size: 10px; }
      .head  { fill: #cbd5e1; font-size: 12px; font-weight: 700; letter-spacing: .12em; }
      .col   { fill: #64748b; font-size: 10px; font-weight: 600; letter-spacing: .06em; }
      .note  { fill: #94a3b8; font-size: 11px; }
      .cyan  { fill: #22d3ee; font-size: 12px; font-weight: 700; }
      .warn  { fill: #fbbf24; font-size: 11px; font-weight: 600; }
      .crit  { fill: #f87171; font-size: 11px; font-weight: 700; }
      .cap   { fill: #64748b; font-size: 10px; font-style: italic; }
    </style>
  </defs>

  <rect class="bg" width="940" height="560"/>
  <text class="ui head" x="24" y="28">FOUR CREDENTIAL ATTACKS — SAME GOAL, FOUR DIFFERENT LOG SIGNATURES</text>

  <!-- table -->
  <rect class="panel" x="24" y="44" width="892" height="332" rx="6"/>
  <text class="ui col" x="40" y="66">TECHNIQUE</text>
  <text class="ui col" x="190" y="66">ACCOUNTS TARGETED</text>
  <text class="ui col" x="320" y="66">PASSWORDS TRIED</text>
  <text class="ui col" x="450" y="66">RATE / SHAPE</text>
  <text class="ui col" x="610" y="66">LOG SIGNATURE</text>
  <line x1="40" y1="76" x2="900" y2="76" stroke="#1e2d4a" stroke-width="1"/>

  <!-- Row 1: Brute force -->
  <text class="cyan" x="40" y="100">BRUTE FORCE</text>
  <text class="dim" x="40" y="114">T1110.001</text>
  <text class="val" x="190" y="100">1 account</text>
  <text class="val" x="320" y="100">Many (dictionary)</text>
  <text class="val" x="450" y="100">High volume, single</text>
  <text class="val" x="450" y="114">source, short burst</text>
  <text class="mono val" x="610" y="100">4625 SubStatus=0xC000006A</text>
  <text class="mono val" x="610" y="116">repeated, one TargetUserName</text>
  <text class="mono val" x="610" y="132">watch 4740 lockout timing</text>
  <line x1="40" y1="146" x2="900" y2="146" stroke="#1e2d4a" stroke-width=".5"/>

  <!-- Row 2: Password spray -->
  <text class="cyan" x="40" y="170">PASSWORD SPRAY</text>
  <text class="dim" x="40" y="184">T1110.003</text>
  <text class="val" x="190" y="170">Many (10s-1000s)</text>
  <text class="val" x="320" y="170">1-2 per round</text>
  <text class="val" x="450" y="170">Low per account,</text>
  <text class="val" x="450" y="184">wide fan-out</text>
  <text class="mono val" x="610" y="170">4625 across many distinct</text>
  <text class="mono val" x="610" y="186">TargetUserName values</text>
  <text class="mono val" x="610" y="202">group by source IP, not account</text>
  <line x1="40" y1="216" x2="900" y2="216" stroke="#1e2d4a" stroke-width=".5"/>

  <!-- Row 3: Credential stuffing -->
  <text class="cyan" x="40" y="240">CREDENTIAL STUFFING</text>
  <text class="dim" x="40" y="254">T1110.004</text>
  <text class="val" x="190" y="240">Many tried, few hit</text>
  <text class="val" x="320" y="240">Known-correct pairs</text>
  <text class="val" x="320" y="254">(from another breach)</text>
  <text class="val" x="450" y="240">High volume, near-zero</text>
  <text class="val" x="450" y="254">fail trail on hits</text>
  <text class="mono val" x="610" y="240">4624 success, first attempt,</text>
  <text class="mono val" x="610" y="256">no preceding 4625 at all</text>
  <text class="mono val" x="610" y="272">Azure AD: leaked-credentials risk</text>
  <line x1="40" y1="286" x2="900" y2="286" stroke="#1e2d4a" stroke-width=".5"/>

  <!-- Row 4: Pass-the-hash -->
  <text class="cyan" x="40" y="310">PASS-THE-HASH</text>
  <text class="dim" x="40" y="324">T1550.002</text>
  <text class="val" x="190" y="310">1 stolen credential,</text>
  <text class="val" x="190" y="324">reused across hosts</text>
  <text class="val" x="320" y="310">None - hash only,</text>
  <text class="val" x="320" y="324">never guessed at all</text>
  <text class="val" x="450" y="310">One logon per host,</text>
  <text class="val" x="450" y="324">spreads fast</text>
  <text class="mono val" x="610" y="310">4624 LogonType 9 locally</text>
  <text class="mono val" x="610" y="326">(NewCredentials / runas /netonly)</text>
  <text class="mono val" x="610" y="342">then LogonType 3, AuthPkg=NTLM</text>

  <!-- bottom: the trap -->
  <rect class="panel" x="24" y="392" width="892" height="150" rx="6"/>
  <text class="ui col" x="40" y="414">THE TRAP — GROUPING BY THE WRONG DIMENSION HIDES EACH ONE</text>

  <text class="warn" x="40" y="440">Group failures by account —</text>
  <text class="note" x="40" y="458">catches brute force, but spraying</text>
  <text class="note" x="40" y="474">never crosses the per-account</text>
  <text class="note" x="40" y="490">lockout threshold on any one login.</text>

  <text class="warn" x="345" y="440">Flag any successful logon —</text>
  <text class="note" x="345" y="458">stuffing's success on the first try</text>
  <text class="note" x="345" y="474">looks exactly like a normal login,</text>
  <text class="note" x="345" y="490">because the password was correct.</text>

  <text class="crit" x="650" y="440">Trust a valid 4624 alone —</text>
  <text class="note" x="650" y="458">pass-the-hash produces a fully</text>
  <text class="note" x="650" y="474">legitimate-looking success event;</text>
  <text class="note" x="650" y="490">the tell is reuse across new hosts.</text>

  <text class="ui cap" x="40" y="524">Same failure shape, different technique: detection has to change what it groups by, not just what it counts.</text>
</svg>
