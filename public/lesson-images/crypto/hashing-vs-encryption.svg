<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" role="img" aria-label="Hashing compared with encryption: hashing is one-way and produces a fixed-length fingerprint, encryption is two-way and reversible with a key">
  <title>Hashing is one-way and identifies; encryption is two-way and conceals</title>
  <defs>
    <style>
      .bg    { fill: #0b0f1e; }
      .panel { fill: #0a1020; stroke: #1e2d4a; stroke-width: 1; }
      .hot   { fill: #0e1b30; stroke: #22d3ee; stroke-width: 1.5; }
      .warm  { fill: #1a1020; stroke: #f472b6; stroke-width: 1.5; }
      .ui    { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; }
      .mono  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; }
      .val   { fill: #e2e8f0; }
      .dim   { fill: #64748b; }
      .head  { fill: #cbd5e1; font-size: 12px; font-weight: 700; letter-spacing: .12em; }
      .col   { fill: #64748b; font-size: 10px; font-weight: 600; letter-spacing: .08em; }
      .note  { fill: #94a3b8; font-size: 11px; }
      .cyan  { fill: #22d3ee; font-size: 12px; font-weight: 700; }
      .pink  { fill: #f472b6; font-size: 12px; font-weight: 700; }
      .green { fill: #86efac; }
      .amber { fill: #fbbf24; }
      .red   { fill: #f87171; }
      .cap   { fill: #64748b; font-size: 10px; font-style: italic; }
      .arrow { stroke: #22d3ee; stroke-width: 1.5; fill: none; marker-end: url(#ac); }
      .arrowp{ stroke: #f472b6; stroke-width: 1.5; fill: none; marker-end: url(#ap); }
      .noway { stroke: #f87171; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
    </style>
    <marker id="ac" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#22d3ee"/>
    </marker>
    <marker id="ap" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#f472b6"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="940" height="470"/>

  <!-- ── LEFT: HASHING ─────────────────────────────────────────── -->
  <rect class="panel" x="24" y="20" width="432" height="360" rx="8"/>
  <text class="ui head" x="44" y="48">HASHING</text>
  <text class="ui cyan" x="44" y="68">One-way. It identifies.</text>

  <!-- input -->
  <rect class="hot" x="44" y="88" width="150" height="42" rx="6"/>
  <text class="ui col" x="56" y="106">INPUT (any size)</text>
  <text class="mono val" x="56" y="122">invoice.pdf</text>

  <path class="arrow" d="M200,109 L246,109"/>
  <rect class="panel" x="252" y="88" width="86" height="42" rx="6"/>
  <text class="ui col" x="264" y="106">ALGORITHM</text>
  <text class="mono val" x="264" y="122">SHA-256</text>
  <path class="arrow" d="M344,109 L390,109"/>

  <!-- digest 1 -->
  <rect class="hot" x="44" y="150" width="376" height="46" rx="6"/>
  <text class="ui col" x="56" y="168">DIGEST — always 64 hex characters</text>
  <text class="mono green" x="56" y="186">e3b0c44298fc1c149afbf4c8996fb924...b855</text>

  <!-- one byte changed -->
  <text class="ui note" x="44" y="222">Change ONE byte of the file:</text>
  <rect class="hot" x="44" y="234" width="376" height="46" rx="6"/>
  <text class="ui col" x="56" y="252">DIGEST — same length, completely different</text>
  <text class="mono amber" x="56" y="270">9f86d081884c7d659a2feaa0c55ad015...0f00</text>

  <!-- one way -->
  <path class="noway" d="M400,320 L100,320"/>
  <text class="ui red" x="112" y="312" font-size="11" font-weight="700">You cannot go back — the file is not inside the hash</text>
  <text class="ui cap" x="44" y="350">Same file anywhere in the world = same digest.</text>
  <text class="ui cap" x="44" y="366">That is why a hash works as an identifier.</text>

  <!-- ── RIGHT: ENCRYPTION ─────────────────────────────────────── -->
  <rect class="panel" x="484" y="20" width="432" height="360" rx="8"/>
  <text class="ui head" x="504" y="48">ENCRYPTION</text>
  <text class="ui pink" x="504" y="68">Two-way. It conceals.</text>

  <rect class="warm" x="504" y="88" width="150" height="42" rx="6"/>
  <text class="ui col" x="516" y="106">PLAINTEXT</text>
  <text class="mono val" x="516" y="122">Transfer $40,000</text>

  <path class="arrowp" d="M660,109 L706,109"/>
  <rect class="panel" x="712" y="88" width="86" height="42" rx="6"/>
  <text class="ui col" x="724" y="106">AES + KEY</text>
  <text class="mono amber" x="724" y="122">key</text>
  <path class="arrowp" d="M804,109 L850,109"/>

  <rect class="warm" x="504" y="150" width="376" height="46" rx="6"/>
  <text class="ui col" x="516" y="168">CIPHERTEXT — unreadable without the key</text>
  <text class="mono green" x="516" y="186">U2FsdGVkX1+9Kf2p0rTnQw==</text>

  <text class="ui note" x="504" y="222">With the key, you get the original back:</text>
  <rect class="warm" x="504" y="234" width="376" height="46" rx="6"/>
  <text class="ui col" x="516" y="252">DECRYPTED — identical to what went in</text>
  <text class="mono val" x="516" y="270">Transfer $40,000</text>

  <path class="arrowp" d="M860,320 L560,320"/>
  <text class="ui pink" x="572" y="312" font-size="11" font-weight="700">Reversible by design — that is the whole point</text>
  <text class="ui cap" x="504" y="350">The secret is the key, never the algorithm.</text>
  <text class="ui cap" x="504" y="366">Everyone knows how AES works; only you hold the key.</text>

  <!-- ── BOTTOM TAKEAWAY ───────────────────────────────────────── -->
  <rect class="panel" x="24" y="396" width="892" height="52" rx="8"/>
  <text class="ui note" x="44" y="418">If someone says a password is "encrypted" in a database, ask a follow-up question.</text>
  <text class="ui note" x="44" y="437">Passwords should be <tspan class="cyan">hashed</tspan><tspan class="note"> (one-way, unrecoverable), not </tspan><tspan class="pink">encrypted</tspan><tspan class="note"> (reversible by anyone holding the key).</tspan></text>
</svg>
