<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-label="Why an exact hash fails to catch malware variants when one byte changes, while fuzzy hashing and imphash still cluster the variants as the same family.">
  <title>Exact hash vs fuzzy hash / imphash — catching the malware family, not just one file</title>
  <defs>
    <style>
      .bg{fill:#0b0f1e;} .ui{font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;} .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;}
      .fileA{fill:#0e1b30;stroke:#22d3ee;stroke-width:1.5;} .fileB{fill:#0e1b30;stroke:#a78bfa;stroke-width:1.5;}
      .bad{fill:#26100f;stroke:#f87171;stroke-width:1.5;} .ok{fill:#0e2018;stroke:#22c55e;stroke-width:1.5;}
      .t{fill:#e2e8f0;font-size:12px;font-weight:700;} .s{fill:#94a3b8;font-size:11px;} .mo{font-size:10.5px;}
      .cy{fill:#67e8f9;} .pu{fill:#c4b5fd;} .red{fill:#fca5a5;} .green{fill:#86efac;}
      .head{fill:#cbd5e1;font-size:12px;font-weight:700;letter-spacing:.05em;}
      .flow{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#a);}
    </style>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#475569"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="960" height="400"/>
  <text class="ui head" x="30" y="30">ONE BYTE CHANGES → THE EXACT HASH IS USELESS, BUT THE FAMILY IS STILL VISIBLE</text>

  <rect class="fileA" x="24" y="50" width="200" height="70" rx="8"/>
  <text class="ui t" x="40" y="76">malware v1</text>
  <text class="ui mono s cy" x="40" y="98">SHA-256: a1b2c3…</text>
  <text class="ui fileB" x="0" y="0"></text>
  <rect class="fileB" x="24" y="150" width="200" height="70" rx="8"/>
  <text class="ui t" x="40" y="176">malware v2 (1 byte changed)</text>
  <text class="ui mono s pu" x="40" y="198">SHA-256: f9e8d7…</text>
  <text class="ui s" x="40" y="240">The attacker flips a single byte — recompiles,</text>
  <text class="ui s" x="40" y="258">re-packs, or adds a comment. Costs seconds.</text>

  <!-- exact hash blocklist -->
  <rect class="bad" x="270" y="80" width="230" height="110" rx="10"/>
  <text class="ui t red" x="286" y="104">Exact-hash blocklist</text>
  <text class="ui s" x="286" y="128">Knows a1b2c3… is bad.</text>
  <text class="ui s red" x="286" y="150">f9e8d7… is a totally different</text>
  <text class="ui s red" x="286" y="168">string → NOT matched. v2 walks</text>
  <text class="ui s red" x="286" y="184">right past. You caught 1 file.</text>
  <line class="flow" x1="224" y1="85" x2="268" y2="110"/>
  <line class="flow" x1="224" y1="185" x2="268" y2="160"/>

  <!-- fuzzy + imphash -->
  <rect class="ok" x="540" y="60" width="396" height="150" rx="10"/>
  <text class="ui t green" x="556" y="84">Similarity hashing — clusters the family</text>
  <text class="ui mono s" x="556" y="110" style="fill:#e2e8f0">ssdeep v1: 768:Abc…Xyz</text>
  <text class="ui mono s" x="556" y="130" style="fill:#e2e8f0">ssdeep v2: 768:Abc…Xyw   → 97% match</text>
  <text class="ui green" x="556" y="156">Fuzzy hashes stay SIMILAR when the file changes</text>
  <text class="ui green" x="556" y="174">a little — so v1 and v2 cluster as one family.</text>
  <text class="ui s" x="556" y="196" style="fill:#94a3b8">imphash: same import table → same hash → clusters by behaviour.</text>

  <rect class="fileA" x="24" y="272" width="912" height="104" rx="10" style="stroke:#334155"/>
  <text class="ui head" x="40" y="298">THE ANALYST LESSON</text>
  <text class="ui s" x="40" y="322">An <tspan class="cy" style="font-weight:700">exact hash</tspan> (SHA-256) proves two files are identical — great for confirming a known-bad file, useless the moment the</text>
  <text class="ui s" x="40" y="342">attacker changes one byte (which is why hashes are the bottom of the Pyramid of Pain). <tspan class="green" style="font-weight:700">Fuzzy hashes</tspan> (ssdeep) measure</text>
  <text class="ui s" x="40" y="362">SIMILARITY and <tspan class="green" style="font-weight:700">imphash</tspan> groups by imported functions — so you hunt the whole malware family, not one disposable sample.</text>
</svg>
