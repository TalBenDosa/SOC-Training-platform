<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-label="How a Kerberoasting attack works: any domain user requests a service ticket for a service account, which is encrypted with that account's password hash, then cracks it offline to recover the service account password.">
  <title>Kerberoasting — request a service ticket, then crack it offline</title>
  <defs>
    <style>
      .bg{fill:#0b0f1e;} .ui{font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;} .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;}
      .box{fill:#0e1b30;stroke:#334155;stroke-width:1.5;} .att{fill:#26100f;stroke:#f87171;stroke-width:1.5;} .kdc{fill:#241a06;stroke:#fbbf24;stroke-width:2;} .ok{fill:#0e2018;stroke:#22c55e;stroke-width:1.5;}
      .t{fill:#e2e8f0;font-size:12px;font-weight:700;} .s{fill:#94a3b8;font-size:10.5px;} .n{fill:#22d3ee;font-size:12px;font-weight:800;}
      .red{fill:#fca5a5;font-size:10.5px;} .gold{fill:#fcd34d;font-size:11px;font-weight:700;} .green{fill:#86efac;font-size:10.5px;}
      .head{fill:#cbd5e1;font-size:12px;font-weight:700;letter-spacing:.05em;}
      .flow{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#a);}
    </style>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#475569"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="960" height="420"/>
  <text class="ui head" x="30" y="30">KERBEROASTING — ANY DOMAIN USER CAN ASK FOR A TICKET IT CAN CRACK OFFLINE</text>

  <rect class="att" x="24" y="58" width="180" height="90" rx="10"/>
  <text class="ui t" x="40" y="84" style="fill:#fca5a5">Any domain user</text>
  <text class="ui s" x="40" y="106">a normal, low-privilege</text>
  <text class="ui s" x="40" y="122">account (or one stolen).</text>
  <text class="ui s" x="40" y="138">No admin rights needed.</text>

  <rect class="kdc" x="390" y="52" width="180" height="104" rx="10"/>
  <text class="ui gold" x="410" y="78">KDC (Domain</text>
  <text class="ui gold" x="410" y="94">Controller)</text>
  <text class="ui s" x="406" y="118">issues a service ticket</text>
  <text class="ui s" x="406" y="134">(TGS) for the requested</text>
  <text class="ui s" x="406" y="150">SPN — by design.</text>

  <rect class="box" x="756" y="58" width="180" height="90" rx="10"/>
  <text class="ui t" x="772" y="84">Service account</text>
  <text class="ui s" x="772" y="106">e.g. svc-sql, with an</text>
  <text class="ui s" x="772" y="122">SPN registered. Often a</text>
  <text class="ui s" x="772" y="138">weak, never-changed pw.</text>

  <text class="ui n" x="230" y="88">1</text>
  <text class="ui s" x="214" y="104">"Give me a TGS</text>
  <text class="ui s" x="214" y="118">for SPN svc-sql"</text>
  <line class="flow" x1="204" y1="100" x2="388" y2="100"/>

  <text class="ui n" x="600" y="88">2</text>
  <text class="ui s" x="588" y="104">TGS returned —</text>
  <text class="ui red" x="588" y="118">encrypted with the</text>
  <text class="ui red" x="588" y="132">service account's</text>
  <text class="ui red" x="588" y="146">password hash (RC4)</text>
  <line class="flow" x1="570" y1="104" x2="754" y2="104"/>
  <line class="flow" x1="388" y1="120" x2="206" y2="150"/>

  <rect class="att" x="24" y="196" width="912" height="86" rx="10"/>
  <text class="ui n" x="40" y="222">3</text>
  <text class="ui t" x="64" y="222" style="fill:#fca5a5">Take the ticket OFFLINE and crack it</text>
  <text class="ui s" x="64" y="244">The attacker walks away with the encrypted TGS and runs hashcat against it on their own hardware — no more traffic to the DC,</text>
  <text class="ui s" x="64" y="262">nothing to lock out or alert. If the service account's password is weak, it falls — and now the attacker HAS that account's password.</text>

  <rect class="ok" x="24" y="298" width="912" height="98" rx="10"/>
  <text class="ui head" x="40" y="324">WHY IT'S DANGEROUS — AND HOW YOU CATCH IT</text>
  <text class="ui s" x="40" y="348"><tspan class="red" style="font-weight:700">Dangerous:</tspan> service accounts are often over-privileged, and any user can request the ticket — so one normal account becomes a path to a</text>
  <text class="ui s" x="40" y="366">powerful service account. The cracking is offline, so lockout/rate-limits don't apply. MITRE ATT&amp;CK T1558.003.</text>
  <text class="ui s" x="40" y="388"><tspan class="green" style="font-weight:700">Catch it:</tspan> Event 4769 (TGS requested) with encryption type 0x17 (RC4) + one account requesting many SPN tickets in a burst. Defend: long/random service-account passwords (or gMSA), AES.</text>
</svg>
