<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-label="How Pass-the-Hash and Pass-the-Ticket let an attacker authenticate using a stolen NTLM hash or Kerberos ticket without ever knowing the plaintext password.">
  <title>Pass-the-Hash and Pass-the-Ticket — authenticating without the password</title>
  <defs>
    <style>
      .bg{fill:#0b0f1e;} .ui{font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;} .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;}
      .att{fill:#26100f;stroke:#f87171;stroke-width:1.5;} .box{fill:#0e1b30;stroke:#334155;stroke-width:1.5;} .tgt{fill:#0e1b30;stroke:#22d3ee;stroke-width:1.5;} .ok{fill:#0e2018;stroke:#22c55e;stroke-width:1.5;}
      .t{fill:#e2e8f0;font-size:12px;font-weight:700;} .s{fill:#94a3b8;font-size:10.5px;} .mono2{font-size:10.5px;}
      .red{fill:#fca5a5;font-size:10.5px;} .cy{fill:#67e8f9;font-size:12px;font-weight:700;} .pu{fill:#c4b5fd;font-size:12px;font-weight:700;} .green{fill:#86efac;font-size:10.5px;}
      .head{fill:#cbd5e1;font-size:12px;font-weight:700;letter-spacing:.05em;}
      .flow{stroke:#f87171;stroke-width:2.5;fill:none;marker-end:url(#a);}
    </style>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#f87171"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="960" height="420"/>
  <text class="ui head" x="30" y="30">THE HASH OR TICKET *IS* THE CREDENTIAL — NO PLAINTEXT PASSWORD NEEDED</text>

  <!-- PtH -->
  <rect class="att" x="24" y="52" width="230" height="120" rx="10"/>
  <text class="ui cy" x="40" y="78">PASS-THE-HASH (T1550.002)</text>
  <text class="ui s" x="40" y="100">Attacker dumped an NTLM</text>
  <text class="ui s" x="40" y="116">password HASH from LSASS.</text>
  <text class="ui mono s" x="40" y="138" style="fill:#e2e8f0">hash: a1b2c3d4…</text>
  <text class="ui s" x="40" y="160">They never cracked it.</text>

  <rect class="tgt" x="430" y="52" width="230" height="120" rx="10"/>
  <text class="ui t" x="446" y="78">Remote host / share</text>
  <text class="ui s" x="446" y="100">NTLM authentication accepts</text>
  <text class="ui s" x="446" y="116">the HASH as proof of identity —</text>
  <text class="ui s" x="446" y="132">it never asks for the plaintext.</text>
  <text class="ui green" x="446" y="156">→ Logged in as the victim.</text>
  <line class="flow" x1="254" y1="112" x2="428" y2="112"/>
  <text class="ui red" x="300" y="102">authenticate</text>
  <text class="ui red" x="300" y="128">WITH the hash</text>

  <!-- PtT -->
  <rect class="att" x="24" y="196" width="230" height="120" rx="10"/>
  <text class="ui pu" x="40" y="222">PASS-THE-TICKET (T1550.003)</text>
  <text class="ui s" x="40" y="244">Attacker stole a Kerberos</text>
  <text class="ui s" x="40" y="260">TICKET (TGT or TGS) from</text>
  <text class="ui s" x="40" y="276">memory, then injects it into</text>
  <text class="ui s" x="40" y="292">their own logon session.</text>

  <rect class="tgt" x="430" y="196" width="230" height="120" rx="10"/>
  <text class="ui t" x="446" y="222">Kerberos service</text>
  <text class="ui s" x="446" y="244">The ticket already proves the</text>
  <text class="ui s" x="446" y="260">holder authenticated — so the</text>
  <text class="ui s" x="446" y="276">service grants access to the</text>
  <text class="ui s" x="446" y="292">ticket's identity, no pw needed.</text>
  <line class="flow" x1="254" y1="256" x2="428" y2="256"/>
  <text class="ui red" x="300" y="246">present</text>
  <text class="ui red" x="300" y="272">the ticket</text>

  <rect class="ok" x="690" y="52" width="246" height="264" rx="10"/>
  <text class="ui head" x="706" y="78">WHY IT MATTERS</text>
  <text class="ui s" x="706" y="102">• Stealing the hash/ticket needs</text>
  <text class="ui s" x="706" y="118">  only admin on ONE host (LSASS).</text>
  <text class="ui s" x="706" y="140">• Cracking is skipped entirely —</text>
  <text class="ui s" x="706" y="156">  the secret is replayed as-is.</text>
  <text class="ui s" x="706" y="178">• This is how attackers move</text>
  <text class="ui s" x="706" y="194">  laterally across the domain.</text>
  <text class="ui green" x="706" y="222" style="font-weight:700">Detect / defend:</text>
  <text class="ui s" x="706" y="242">• NTLM logons where Kerberos</text>
  <text class="ui s" x="706" y="258">  is expected; 4624 type 3 + 4672</text>
  <text class="ui s" x="706" y="278">• Protect LSASS (Credential Guard)</text>
  <text class="ui s" x="706" y="294">• LAPS, tiering, disable NTLM,</text>
  <text class="ui s" x="706" y="310">  short ticket lifetimes</text>
</svg>
