<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 500" role="img" aria-label="Timeline comparison of C2 beaconing connections at near-fixed intervals with small jitter, plotted against irregular bursty human browsing traffic on the same time axis, with a bottom panel listing the fields that give beaconing away: fixed interval, near-identical byte counts, short connection duration, and a single destination held for hours">
  <title>Beaconing rhythm vs human browsing, plotted on the same timeline</title>
  <defs>
    <style>
      .bg    { fill: #0b0f1e; }
      .panel { fill: #0a1020; stroke: #1e2d4a; stroke-width: 1; }
      .ui    { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; }
      .mono  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 10.5px; }
      .val   { fill: #e2e8f0; font-size: 11px; }
      .dim   { fill: #64748b; font-size: 10px; }
      .head  { fill: #cbd5e1; font-size: 12px; font-weight: 700; letter-spacing: .12em; }
      .col   { fill: #64748b; font-size: 10px; font-weight: 600; letter-spacing: .06em; }
      .note  { fill: #94a3b8; font-size: 11px; }
      .cyan  { fill: #22d3ee; font-size: 12px; font-weight: 700; }
      .warn  { fill: #fbbf24; font-size: 11px; font-weight: 600; }
      .crit  { fill: #f87171; font-size: 11px; font-weight: 700; }
      .cap   { fill: #64748b; font-size: 10px; font-style: italic; }
      .axis  { stroke: #1e2d4a; stroke-width: 1; }
    </style>
  </defs>

  <rect class="bg" width="940" height="500"/>
  <text class="ui head" x="24" y="28">BEACONING RHYTHM vs HUMAN BROWSING — SAME TIME AXIS</text>

  <!-- Beacon lane -->
  <rect class="panel" x="24" y="44" width="892" height="120" rx="6"/>
  <text class="cyan" x="40" y="66">C2 BEACON — 60s SLEEP, 20% JITTER (48-72s ACTUAL SPACING)</text>
  <line class="axis" x1="40" y1="130" x2="900" y2="130"/>
  <!-- dots roughly evenly spaced with tiny jitter -->
  <g fill="#22d3ee">
    <circle cx="60"  cy="130" r="5"/>
    <circle cx="128" cy="130" r="5"/>
    <circle cx="193" cy="130" r="5"/>
    <circle cx="262" cy="130" r="5"/>
    <circle cx="327" cy="130" r="5"/>
    <circle cx="396" cy="130" r="5"/>
    <circle cx="461" cy="130" r="5"/>
    <circle cx="530" cy="130" r="5"/>
    <circle cx="595" cy="130" r="5"/>
    <circle cx="664" cy="130" r="5"/>
    <circle cx="729" cy="130" r="5"/>
    <circle cx="798" cy="130" r="5"/>
    <circle cx="863" cy="130" r="5"/>
  </g>
  <text class="mono note" x="40" y="150">connect · sleep · connect · sleep — near-identical spacing all the way across, hour after hour</text>

  <!-- Human lane -->
  <rect class="panel" x="24" y="180" width="892" height="120" rx="6"/>
  <text class="val" x="40" y="202" fill="#86efac" font-weight="700" font-size="12">HUMAN BROWSING — BURSTY, CLUSTERED, NO FIXED RHYTHM</text>
  <line class="axis" x1="40" y1="266" x2="900" y2="266"/>
  <g fill="#86efac">
    <circle cx="55"  cy="266" r="4"/><circle cx="62" cy="266" r="4"/><circle cx="71" cy="266" r="4"/>
    <circle cx="150" cy="266" r="4"/>
    <circle cx="300" cy="266" r="4"/><circle cx="308" cy="266" r="4"/><circle cx="315" cy="266" r="4"/><circle cx="326" cy="266" r="4"/>
    <circle cx="480" cy="266" r="4"/>
    <circle cx="610" cy="266" r="4"/><circle cx="618" cy="266" r="4"/>
    <circle cx="760" cy="266" r="4"/><circle cx="770" cy="266" r="4"/><circle cx="778" cy="266" r="4"/>
    <circle cx="860" cy="266" r="4"/>
  </g>
  <text class="mono note" x="40" y="286">clusters when loading a page, then long silent gaps while reading — intervals vary wildly, no tight mean</text>

  <!-- bottom: tells -->
  <rect class="panel" x="24" y="316" width="892" height="164" rx="6"/>
  <text class="ui col" x="40" y="338">FIELDS THAT GIVE BEACONING AWAY</text>

  <text class="warn" x="40" y="364">Fixed interval (+/- small jitter)</text>
  <text class="note" x="40" y="382">Low coefficient of variation (stdev/mean)</text>
  <text class="note" x="40" y="398">on the time delta between connections</text>

  <text class="warn" x="345" y="364">Near-identical byte counts</text>
  <text class="note" x="345" y="382">POST/check-in bodies cluster tightly —</text>
  <text class="note" x="345" y="398">tight stdev on outbound bytes per hit</text>

  <text class="warn" x="650" y="364">Short connection duration</text>
  <text class="note" x="650" y="382">Connect, ask "any tasks?", disconnect —</text>
  <text class="note" x="650" y="398">no lingering session like a real download</text>

  <text class="warn" x="40" y="428">Single destination held for hours</text>
  <text class="note" x="40" y="446">One rare or unfamiliar host contacted</text>
  <text class="note" x="40" y="462">repeatedly across an entire shift</text>

  <text class="ui cap" x="345" y="446">Any one of these alone can be innocent — a monitoring agent is regular too. All four together, to an unfamiliar destination, is a high-fidelity beacon.</text>
</svg>
