<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" role="img" aria-label="The TCP three-way handshake between a client and a server, and how a half-open port scan differs from it.">
  <title>The TCP three-way handshake, and what a port scan looks like</title>
  <defs>
    <style>
      .bg   { fill: #0b0f1e; }
      .ui   { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .node { fill: #0e1b30; stroke: #22d3ee; stroke-width: 1.5; }
      .life { stroke: #1e2d4a; stroke-width: 2; stroke-dasharray: 4 4; }
      .lab  { fill: #cbd5e1; font-size: 13px; font-weight: 700; }
      .flow { stroke: #22d3ee; stroke-width: 2; fill: none; marker-end: url(#ah); }
      .flowr{ stroke: #86efac; stroke-width: 2; fill: none; marker-end: url(#ahg); }
      .pkt  { fill: #e2e8f0; font-size: 12px; }
      .ok   { fill: #86efac; font-size: 12px; font-weight: 700; }
      .warn { fill: #fca5a5; font-size: 12px; font-weight: 700; }
      .note { fill: #64748b; font-size: 11px; }
      .head { fill: #94a3b8; font-size: 12px; font-weight: 700; letter-spacing: .05em; }
    </style>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#22d3ee"/></marker>
    <marker id="ahg" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#86efac"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="940" height="470"/>

  <!-- LEFT: the real handshake -->
  <text class="ui head" x="70" y="34">A COMPLETED CONNECTION</text>
  <rect class="node" x="70" y="52" width="120" height="34" rx="7"/>
  <text class="ui lab" x="130" y="74" text-anchor="middle">Client</text>
  <rect class="node" x="330" y="52" width="120" height="34" rx="7"/>
  <text class="ui lab" x="390" y="74" text-anchor="middle">Server</text>
  <line class="life" x1="130" y1="86" x2="130" y2="360"/>
  <line class="life" x1="390" y1="86" x2="390" y2="360"/>

  <line class="flow" x1="132" y1="120" x2="388" y2="150"/>
  <text class="ui mono pkt" x="150" y="115">1 · SYN  — "can we talk?"</text>
  <line class="flowr" x1="388" y1="185" x2="132" y2="215"/>
  <text class="ui mono pkt" x="150" y="205" text-anchor="start">2 · SYN-ACK — "yes, can you?"</text>
  <line class="flow" x1="132" y1="250" x2="388" y2="280"/>
  <text class="ui mono pkt" x="150" y="245">3 · ACK  — "we're connected"</text>

  <rect x="150" y="300" width="220" height="34" rx="7" fill="#0e2018" stroke="#22c55e" stroke-width="1.5"/>
  <text class="ui ok" x="260" y="322" text-anchor="middle">ESTABLISHED — data flows</text>
  <text class="ui note" x="70" y="360">All three packets = a real connection. This is what a normal log line records.</text>

  <!-- RIGHT: the scan -->
  <text class="ui head" x="560" y="34">A SYN / HALF-OPEN SCAN</text>
  <rect class="node" x="560" y="52" width="120" height="34" rx="7"/>
  <text class="ui lab" x="620" y="74" text-anchor="middle">Attacker</text>
  <rect class="node" x="800" y="52" width="120" height="34" rx="7"/>
  <text class="ui lab" x="860" y="74" text-anchor="middle">Target</text>
  <line class="life" x1="620" y1="86" x2="620" y2="360"/>
  <line class="life" x1="860" y1="86" x2="860" y2="360"/>

  <line class="flow" x1="622" y1="120" x2="858" y2="140"/>
  <text class="ui mono pkt" x="560" y="112">SYN → port 22</text>
  <line class="flow" x1="622" y1="165" x2="858" y2="185"/>
  <text class="ui mono pkt" x="560" y="157">SYN → port 445</text>
  <line class="flow" x1="622" y1="210" x2="858" y2="230"/>
  <text class="ui mono pkt" x="560" y="202">SYN → port 3389</text>
  <text class="ui warn" x="560" y="270">…many SYNs, few or no ACKs.</text>
  <text class="ui note" x="560" y="300">The attacker never completes the handshake — they</text>
  <text class="ui note" x="560" y="316">only want to learn which ports answer. A burst of</text>
  <text class="ui note" x="560" y="332">SYNs to many ports from one source = a port scan.</text>
</svg>
