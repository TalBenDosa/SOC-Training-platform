<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 520" role="img" aria-label="Table of private IP address ranges versus public addresses, and a diagram showing how NAT translates an internal address into a shared public one at the firewall">
  <title>Private vs public IP ranges, and how NAT changes the source address in your logs</title>
  <defs>
    <style>
      .bg    { fill: #0b0f1e; }
      .panel { fill: #0a1020; stroke: #1e2d4a; stroke-width: 1; }
      .hot   { fill: #0e1b30; stroke: #22d3ee; stroke-width: 1.5; }
      .ui    { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; }
      .mono  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
      .val   { fill: #e2e8f0; }
      .dim   { fill: #64748b; }
      .head  { fill: #cbd5e1; font-size: 12px; font-weight: 700; letter-spacing: .12em; }
      .col   { fill: #64748b; font-size: 10px; font-weight: 600; letter-spacing: .08em; }
      .note  { fill: #94a3b8; font-size: 11px; }
      .cyan  { fill: #22d3ee; font-size: 12px; font-weight: 700; }
      .warn  { fill: #fbbf24; font-size: 12px; font-weight: 700; }
      .good  { fill: #86efac; font-size: 12px; font-weight: 700; }
      .cap   { fill: #64748b; font-size: 10px; font-style: italic; }
      .arrow { stroke: #22d3ee; stroke-width: 1.5; fill: none; marker-end: url(#a2); opacity: .8; }
    </style>
    <marker id="a2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#22d3ee"/>
    </marker>
  </defs>

  <rect class="bg" width="940" height="520"/>
  <text class="ui head" x="24" y="30">PRIVATE VS PUBLIC IP, AND WHAT NAT DOES TO YOUR LOGS</text>

  <!-- Private ranges table -->
  <rect class="panel" x="24" y="46" width="892" height="150" rx="6"/>
  <text class="ui col" x="40" y="68">RANGE (RFC 1918 — PRIVATE)</text>
  <text class="ui col" x="330" y="68">CIDR</text>
  <text class="ui col" x="450" y="68">TYPICAL USE</text>
  <text class="ui col" x="660" y="68">EXAMPLE</text>

  <line x1="40" y1="78" x2="900" y2="78" stroke="#1e2d4a" stroke-width="1"/>

  <text class="mono val" x="40" y="102">10.0.0.0 - 10.255.255.255</text>
  <text class="mono cyan" x="330" y="102">/8</text>
  <text class="ui note" x="450" y="102">Large enterprises, data centers</text>
  <text class="mono val" x="660" y="102">10.4.2.15</text>

  <text class="mono val" x="40" y="126">172.16.0.0 - 172.31.255.255</text>
  <text class="mono cyan" x="330" y="126">/12</text>
  <text class="ui note" x="450" y="126">Mid-size networks, containers</text>
  <text class="mono val" x="660" y="126">172.18.5.9</text>

  <text class="mono val" x="40" y="150">192.168.0.0 - 192.168.255.255</text>
  <text class="mono cyan" x="330" y="150">/16</text>
  <text class="ui note" x="450" y="150">Homes, small offices</text>
  <text class="mono val" x="660" y="150">192.168.1.50</text>

  <line x1="40" y1="164" x2="900" y2="164" stroke="#1e2d4a" stroke-width="1"/>
  <text class="mono val" x="40" y="184">Anything outside these three ranges</text>
  <text class="good" x="450" y="184">PUBLIC — globally unique, routable on the internet</text>

  <!-- NAT diagram -->
  <text class="ui head" x="24" y="228">NAT: WHY THE SAME LAPTOP HAS TWO ADDRESSES</text>

  <rect class="panel" x="24" y="244" width="240" height="90" rx="6"/>
  <text class="ui col" x="38" y="264">LAPTOP</text>
  <text class="mono val" x="38" y="288">10.4.2.15</text>
  <text class="ui note" x="38" y="308">Private address, only</text>
  <text class="ui note" x="38" y="322">meaningful inside the office LAN.</text>

  <path class="arrow" d="M264,289 L344,289"/>
  <text class="ui note" x="270" y="278">connects out</text>

  <rect class="hot" x="348" y="244" width="240" height="90" rx="6"/>
  <text class="ui col" x="362" y="264">FIREWALL / ROUTER (NAT)</text>
  <text class="mono val" x="362" y="288">src=10.4.2.15</text>
  <text class="mono val" x="362" y="306">xlatesrc=203.0.113.7</text>
  <text class="ui note" x="362" y="324">Rewrites the source on the way out.</text>

  <path class="arrow" d="M588,289 L668,289"/>
  <text class="ui note" x="592" y="278">out to internet</text>

  <rect class="panel" x="672" y="244" width="240" height="90" rx="6"/>
  <text class="ui col" x="686" y="264">EXTERNAL SERVER / INTERNET LOG</text>
  <text class="mono val" x="686" y="288">client=203.0.113.7</text>
  <text class="ui note" x="686" y="308">The 10.4.2.15 laptop is invisible</text>
  <text class="ui note" x="686" y="322">here — only the shared public IP shows.</text>

  <!-- what each log sees -->
  <rect class="panel" x="24" y="352" width="428" height="112" rx="6"/>
  <text class="ui col" x="38" y="372">WHAT THE INTERNAL LOG SEES</text>
  <text class="ui note" x="38" y="394">DNS / EDR / internal firewall logs record</text>
  <text class="ui note" x="38" y="410">the real private address — the actual host</text>
  <text class="ui note" x="38" y="426">you can walk over to or isolate.</text>
  <text class="cyan" x="38" y="448">Use this address to identify WHO.</text>

  <rect class="panel" x="488" y="352" width="428" height="112" rx="6"/>
  <text class="ui col" x="502" y="372">WHAT THE EXTERNAL LOG SEES</text>
  <text class="ui note" x="502" y="394">A web server, cloud service, or internet-side</text>
  <text class="ui note" x="502" y="410">capture only ever sees the translated public</text>
  <text class="ui note" x="502" y="426">IP — the internal host is hidden behind it.</text>
  <text class="warn" x="502" y="448">Needs a NAT log to map back to WHO.</text>

  <text class="ui cap" x="24" y="490">To trace a public IP back to a person, find the NAT / firewall log line that shows BOTH src and xlatesrc at that timestamp.</text>
</svg>
