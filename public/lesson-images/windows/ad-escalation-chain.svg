<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 560" role="img" aria-label="Table of the five-stage Active Directory escalation chain - enumeration, Kerberoasting, Pass-the-Hash, DCSync, Golden Ticket - showing what the attacker gains at each stage, the event ID or signal it produces, and the control that stops it">
  <title>Active Directory escalation chain — what each stage gains, the signal it produces, and the control that stops it</title>
  <defs>
    <style>
      .bg    { fill: #0b0f1e; }
      .panel { fill: #0a1020; stroke: #1e2d4a; stroke-width: 1; }
      .ui    { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; }
      .mono  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 10.5px; }
      .val   { fill: #e2e8f0; font-size: 10.5px; }
      .dim   { fill: #64748b; font-size: 10px; }
      .head  { fill: #cbd5e1; font-size: 12px; font-weight: 700; letter-spacing: .12em; }
      .col   { fill: #64748b; font-size: 10px; font-weight: 600; letter-spacing: .06em; }
      .note  { fill: #94a3b8; font-size: 11px; }
      .cyan  { fill: #22d3ee; font-size: 12px; font-weight: 700; }
      .warn  { fill: #fbbf24; font-size: 11px; font-weight: 600; }
      .crit  { fill: #f87171; font-size: 11px; font-weight: 700; }
      .cap   { fill: #64748b; font-size: 10px; font-style: italic; }
    </style>
  </defs>

  <rect class="bg" width="940" height="560"/>
  <text class="ui head" x="24" y="28">ONE ACCOUNT TO DOMAIN ADMIN — THE FIVE-STAGE ESCALATION CHAIN</text>

  <rect class="panel" x="24" y="44" width="892" height="392" rx="6"/>
  <text class="ui col" x="40" y="66">STAGE</text>
  <text class="ui col" x="200" y="66">WHAT THE ATTACKER GAINS</text>
  <text class="ui col" x="440" y="66">EVENT ID / SIGNAL</text>
  <text class="ui col" x="680" y="66">CONTROL THAT STOPS IT</text>
  <line x1="40" y1="76" x2="900" y2="76" stroke="#1e2d4a" stroke-width="1"/>

  <!-- Enumeration -->
  <text class="cyan" x="40" y="98">1. Enumeration</text>
  <text class="dim" x="40" y="112">LDAP / BloodHound</text>
  <text class="val" x="200" y="98">A full attack-path map: who</text>
  <text class="val" x="200" y="112">can reach Domain Admin and</text>
  <text class="val" x="200" y="126">through which permission chain</text>
  <text class="mono val" x="440" y="98">Broad, systematic LDAP</text>
  <text class="mono val" x="440" y="112">sweep from one account,</text>
  <text class="mono val" x="440" y="126">short window, no prior history</text>
  <text class="val" x="680" y="98">LDAP query volume alerting;</text>
  <text class="val" x="680" y="112">honeytoken accounts to bait</text>
  <text class="val" x="680" y="126">BloodHound-style collection</text>
  <line x1="40" y1="140" x2="900" y2="140" stroke="#1e2d4a" stroke-width=".5"/>

  <!-- Kerberoasting -->
  <text class="cyan" x="40" y="162">2. Kerberoasting</text>
  <text class="val" x="200" y="162">A crackable service account</text>
  <text class="val" x="200" y="176">password hash, cracked</text>
  <text class="val" x="200" y="190">entirely offline</text>
  <text class="mono val" x="440" y="162">EventID 4769, encryption</text>
  <text class="mono val" x="440" y="176">type 0x17 (RC4), many SPNs</text>
  <text class="mono val" x="440" y="190">requested by one account</text>
  <text class="val" x="680" y="162">Long random service-account</text>
  <text class="val" x="680" y="176">passwords or gMSA; enforce</text>
  <text class="val" x="680" y="190">AES, disable RC4</text>
  <line x1="40" y1="204" x2="900" y2="204" stroke="#1e2d4a" stroke-width=".5"/>

  <!-- Pass-the-Hash -->
  <text class="cyan" x="40" y="226">3. Pass-the-Hash</text>
  <text class="val" x="200" y="226">Lateral movement to any host</text>
  <text class="val" x="200" y="240">trusting NTLM from that</text>
  <text class="val" x="200" y="254">account, no password needed</text>
  <text class="mono val" x="440" y="226">EventID 4624 LogonType 9,</text>
  <text class="mono val" x="440" y="240">NTLM auth on a domain-</text>
  <text class="mono val" x="440" y="254">joined host expecting Kerberos</text>
  <text class="val" x="680" y="226">Protected Users group; Tier 0/1/2</text>
  <text class="val" x="680" y="240">separation; LAPS for local admin</text>
  <line x1="40" y1="268" x2="900" y2="268" stroke="#1e2d4a" stroke-width=".5"/>

  <!-- DCSync -->
  <text class="cyan" x="40" y="290">4. DCSync</text>
  <text class="val" x="200" y="290">Any account's password hash,</text>
  <text class="val" x="200" y="304">including krbtgt — the domain's</text>
  <text class="val" x="200" y="318">Kerberos root of trust</text>
  <text class="mono val" x="440" y="290">EventID 4662 against</text>
  <text class="mono val" x="440" y="304">replication-rights GUIDs, from</text>
  <text class="mono val" x="440" y="318">a source that is NOT a real DC</text>
  <text class="val" x="680" y="290">Restrict Replicating Directory</text>
  <text class="val" x="680" y="304">Changes rights; alert on non-DC</text>
  <text class="val" x="680" y="318">sources invoking them</text>
  <line x1="40" y1="332" x2="900" y2="332" stroke="#1e2d4a" stroke-width=".5"/>

  <!-- Golden Ticket -->
  <text class="cyan" x="40" y="354">5. Golden Ticket</text>
  <text class="val" x="200" y="354">A forged, cryptographically</text>
  <text class="val" x="200" y="368">valid TGT for any account, any</text>
  <text class="val" x="200" y="382">group, any expiration — offline</text>
  <text class="mono val" x="440" y="354">No DC-side log at forge time;</text>
  <text class="mono val" x="440" y="368">watch for TGTs with anomalous</text>
  <text class="mono val" x="440" y="382">lifetimes or nonexistent users</text>
  <text class="val" x="680" y="354">Reset krbtgt password TWICE</text>
  <text class="val" x="680" y="368">(current + previous hash both</text>
  <text class="val" x="680" y="382">must be invalidated)</text>

  <!-- bottom note -->
  <rect class="panel" x="24" y="446" width="892" height="66" rx="6"/>
  <text class="ui warn" x="40" y="468">CHECKPOINTS ON ONE PATH, NOT INDEPENDENT ALERTS</text>
  <text class="ui note" x="40" y="488">A hit at any stage is reason to hunt for the others in the same timeframe — a 4769 burst without a later 4662</text>
  <text class="ui note" x="40" y="504">does not mean the chain stopped; it may mean the next step has not been attempted, or logged, yet.</text>

  <text class="ui cap" x="24" y="534">Domain-dominance capability rarely shows up as "member of Domain Admins" — it shows up as a chain of individually unremarkable rights.</text>
</svg>
