<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-label="How credential theft from the LSASS process works, from login to memory dump to lateral movement, and where an analyst can detect it.">
  <title>LSASS credential theft: from login, to memory dump, to reuse</title>
  <defs>
    <style>
      .bg    { fill: #0b0f1e; }
      .ui    { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; }
      .mono  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .step  { fill: #0e1b30; stroke: #334155; stroke-width: 1.5; }
      .crown { fill: #241a06; stroke: #fbbf24; stroke-width: 2; }
      .attack{ fill: #26100f; stroke: #f87171; stroke-width: 1.5; }
      .num   { fill: #22d3ee; font-size: 12px; font-weight: 700; }
      .t     { fill: #e2e8f0; font-size: 13px; font-weight: 700; }
      .s     { fill: #94a3b8; font-size: 11px; }
      .warn  { fill: #fca5a5; font-size: 11px; }
      .gold  { fill: #fcd34d; font-size: 12px; font-weight: 700; }
      .flow  { stroke: #475569; stroke-width: 2; fill: none; marker-end: url(#a); }
      .det   { fill: #0e2018; stroke: #22c55e; stroke-width: 1.5; }
      .dett  { fill: #86efac; font-size: 11px; }
      .head  { fill: #cbd5e1; font-size: 12px; font-weight: 700; letter-spacing: .05em; }
    </style>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#475569"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="960" height="440"/>

  <!-- 1: login -->
  <rect class="step" x="24" y="70" width="180" height="120" rx="10"/>
  <text class="ui num" x="40" y="94">STEP 1</text>
  <text class="ui t" x="40" y="118">A user logs in</text>
  <text class="ui s" x="40" y="140">Windows caches their</text>
  <text class="ui s" x="40" y="156">credentials in memory so</text>
  <text class="ui s" x="40" y="172">they aren't retyped all day.</text>

  <!-- 2: LSASS crown jewel -->
  <rect class="crown" x="256" y="55" width="200" height="150" rx="10"/>
  <text class="ui gold" x="272" y="80">👑 LSASS (lsass.exe)</text>
  <text class="ui s" x="272" y="104">Holds, in RAM:</text>
  <text class="ui mono s" x="272" y="126">• NTLM password hashes</text>
  <text class="ui mono s" x="272" y="144">• Kerberos tickets (TGT)</text>
  <text class="ui mono s" x="272" y="162">• sometimes plaintext</text>
  <text class="ui gold" x="272" y="190">The crown jewel.</text>

  <!-- 3: attacker dumps -->
  <rect class="attack" x="508" y="55" width="210" height="150" rx="10"/>
  <text class="ui num" x="524" y="80" style="fill:#f87171">STEP 3 — needs admin</text>
  <text class="ui t" x="524" y="104">Dump LSASS memory</text>
  <text class="ui mono s" x="524" y="128">mimikatz sekurlsa</text>
  <text class="ui mono s" x="524" y="146">comsvcs.dll MiniDump</text>
  <text class="ui mono s" x="524" y="164">Task Manager → dump</text>
  <text class="ui warn" x="524" y="188">→ extracts the secrets above</text>

  <!-- 4: reuse -->
  <rect class="attack" x="770" y="70" width="166" height="120" rx="10"/>
  <text class="ui num" x="786" y="94" style="fill:#f87171">STEP 4</text>
  <text class="ui t" x="786" y="118">Reuse them</text>
  <text class="ui s" x="786" y="140">Pass-the-Hash,</text>
  <text class="ui s" x="786" y="156">Pass-the-Ticket →</text>
  <text class="ui warn" x="786" y="174">move to the next host</text>

  <line class="flow" x1="204" y1="130" x2="254" y2="130"/>
  <line class="flow" x1="456" y1="130" x2="506" y2="130"/>
  <line class="flow" x1="718" y1="130" x2="768" y2="130"/>

  <!-- detection band -->
  <text class="ui head" x="24" y="250">WHERE YOU CATCH IT</text>
  <rect class="det" x="24" y="266" width="290" height="120" rx="10"/>
  <text class="ui dett" x="40" y="290" style="font-weight:700">Anything OPENING lsass.exe</text>
  <text class="ui dett" x="40" y="310">Sysmon Event ID 10 (ProcessAccess)</text>
  <text class="ui dett" x="40" y="328">with GrantedAccess 0x1010/0x1410 —</text>
  <text class="ui dett" x="40" y="346">a non-system process reading LSASS</text>
  <text class="ui dett" x="40" y="364">is almost never legitimate.</text>

  <rect class="det" x="335" y="266" width="290" height="120" rx="10"/>
  <text class="ui dett" x="351" y="290" style="font-weight:700">Suspicious process creation</text>
  <text class="ui dett" x="351" y="310">Event 4688 / Sysmon 1: rundll32</text>
  <text class="ui dett" x="351" y="328">calling comsvcs.dll MiniDump, or</text>
  <text class="ui dett" x="351" y="346">procdump on lsass, or an unsigned</text>
  <text class="ui dett" x="351" y="364">binary spawning from a temp path.</text>

  <rect class="det" x="646" y="266" width="290" height="120" rx="10"/>
  <text class="ui dett" x="662" y="290" style="font-weight:700">The reuse, one hop later</text>
  <text class="ui dett" x="662" y="310">Logons on a second host (4624</text>
  <text class="ui dett" x="662" y="328">type 3) from an account that</text>
  <text class="ui dett" x="662" y="346">never normally touches it —</text>
  <text class="ui dett" x="662" y="364">the lateral-movement signature.</text>

  <text class="ui s" x="24" y="416">MITRE ATT&amp;CK: T1003.001 (LSASS Memory) → T1550 (Use Alternate Auth Material). Admin rights are required to dump LSASS — which is exactly why local-admin sprawl is so dangerous.</text>
</svg>
