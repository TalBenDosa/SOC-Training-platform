<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 500" role="img" aria-label="Illustrative mockup of a Microsoft Defender Advanced Hunting screen showing a KQL query built line by line and a results grid">
  <title>Advanced Hunting — a KQL query and its results (generic mockup)</title>
  <defs>
    <style>
      .bg    { fill: #0b0f1e; }
      .panel { fill: #0a1020; stroke: #1e2d4a; stroke-width: 1; }
      .row   { fill: #0d1526; stroke: #1e2d4a; stroke-width: 1; }
      .hit   { fill: #1a1220; stroke: #f87171; stroke-width: 1; }
      .ui    { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; }
      .mono  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; }
      .head  { fill: #cbd5e1; font-size: 12px; font-weight: 700; letter-spacing: .12em; }
      .col   { fill: #64748b; font-size: 10px; font-weight: 600; letter-spacing: .08em; }
      .tbl   { fill: #7dd3fc; }
      .op    { fill: #c084fc; }
      .str   { fill: #86efac; }
      .fld   { fill: #e2e8f0; }
      .cmt   { fill: #64748b; font-style: italic; }
      .cell  { fill: #cbd5e1; font-size: 11px; }
      .warn  { fill: #f87171; font-size: 11px; font-weight: 600; }
      .note  { fill: #94a3b8; font-size: 11px; }
      .cap   { fill: #64748b; font-size: 10px; font-style: italic; }
      .pill  { fill: #11223a; stroke: #22d3ee; stroke-width: 1; }
      .pillT { fill: #7dd3fc; font-size: 10px; font-weight: 600; }
    </style>
  </defs>

  <rect class="bg" width="940" height="500"/>
  <text class="ui head" x="24" y="28">ADVANCED HUNTING — BUILD THE QUERY ONE LINE AT A TIME</text>

  <!-- query editor -->
  <rect class="panel" x="24" y="44" width="892" height="176" rx="6"/>
  <text class="ui col" x="38" y="64">QUERY EDITOR — KQL</text>

  <text class="mono" x="38" y="90"><tspan class="tbl">DeviceProcessEvents</tspan></text>
  <text class="mono" x="38" y="110"><tspan class="op">| where</tspan><tspan class="fld"> Timestamp </tspan><tspan class="op">&gt;</tspan><tspan class="fld"> ago(</tspan><tspan class="str">24h</tspan><tspan class="fld">)</tspan></text>
  <text class="mono" x="38" y="130"><tspan class="op">| where</tspan><tspan class="fld"> InitiatingProcessFileName </tspan><tspan class="op">==</tspan><tspan class="str"> "winword.exe"</tspan></text>
  <text class="mono" x="38" y="150"><tspan class="op">| where</tspan><tspan class="fld"> FileName </tspan><tspan class="op">in</tspan><tspan class="fld"> (</tspan><tspan class="str">"powershell.exe"</tspan><tspan class="fld">, </tspan><tspan class="str">"cmd.exe"</tspan><tspan class="fld">)</tspan></text>
  <text class="mono" x="38" y="170"><tspan class="op">| project</tspan><tspan class="fld"> Timestamp, DeviceName, AccountName, FileName, ProcessCommandLine</tspan></text>
  <text class="mono" x="38" y="190"><tspan class="op">| order by</tspan><tspan class="fld"> Timestamp </tspan><tspan class="op">desc</tspan></text>
  <text class="mono cmt" x="600" y="110">start from a table, not a search box</text>
  <text class="mono cmt" x="600" y="130">narrow before you widen</text>
  <text class="mono cmt" x="600" y="170">project = choose your columns</text>

  <!-- table pills -->
  <text class="ui col" x="24" y="242">THE FIVE TABLES YOU WILL LIVE IN</text>
  <rect class="pill" x="24"  y="252" width="168" height="24" rx="12"/>
  <text class="ui pillT" x="38"  y="268">DeviceProcessEvents</text>
  <rect class="pill" x="200" y="252" width="172" height="24" rx="12"/>
  <text class="ui pillT" x="214" y="268">DeviceNetworkEvents</text>
  <rect class="pill" x="380" y="252" width="164" height="24" rx="12"/>
  <text class="ui pillT" x="394" y="268">DeviceLogonEvents</text>
  <rect class="pill" x="552" y="252" width="152" height="24" rx="12"/>
  <text class="ui pillT" x="566" y="268">DeviceFileEvents</text>
  <rect class="pill" x="712" y="252" width="180" height="24" rx="12"/>
  <text class="ui pillT" x="726" y="268">DeviceRegistryEvents</text>

  <!-- results -->
  <rect class="panel" x="24" y="292" width="892" height="180" rx="6"/>
  <text class="ui col" x="38" y="312">RESULTS — 3 records</text>

  <text class="ui col" x="38"  y="334">TIMESTAMP</text>
  <text class="ui col" x="176" y="334">DEVICE</text>
  <text class="ui col" x="292" y="334">ACCOUNT</text>
  <text class="ui col" x="386" y="334">FILE</text>
  <text class="ui col" x="500" y="334">COMMAND LINE</text>

  <rect class="hit" x="32" y="342" width="876" height="30" rx="4"/>
  <text class="ui cell" x="38"  y="362">2026-08-11 09:14:52</text>
  <text class="ui cell" x="176" y="362">FIN-WKS-014</text>
  <text class="ui cell" x="292" y="362">d.reyes</text>
  <text class="ui cell" x="386" y="362">powershell.exe</text>
  <text class="ui warn" x="500" y="362">powershell.exe -w hidden -enc SQBFAFgAIAAoAE4A...</text>

  <rect class="row" x="32" y="378" width="876" height="30" rx="4"/>
  <text class="ui cell" x="38"  y="398">2026-08-11 09:02:11</text>
  <text class="ui cell" x="176" y="398">FIN-WKS-022</text>
  <text class="ui cell" x="292" y="398">m.okonkwo</text>
  <text class="ui cell" x="386" y="398">cmd.exe</text>
  <text class="ui cell" x="500" y="398">cmd.exe /c whoami /groups</text>

  <rect class="row" x="32" y="414" width="876" height="30" rx="4"/>
  <text class="ui cell" x="38"  y="434">2026-08-10 16:48:03</text>
  <text class="ui cell" x="176" y="434">HR-LAP-008</text>
  <text class="ui cell" x="292" y="434">s.patel</text>
  <text class="ui cell" x="386" y="434">powershell.exe</text>
  <text class="ui cell" x="500" y="434">powershell.exe -File C:\IT\inventory-report.ps1</text>

  <text class="ui cap" x="38" y="462">Three hits, not one verdict — the third is a signed IT script. The query finds candidates; you decide.</text>

  <text class="ui note" x="24" y="492">Illustrative mockup. Table and operator names are real; the data is synthetic.</text>
</svg>
