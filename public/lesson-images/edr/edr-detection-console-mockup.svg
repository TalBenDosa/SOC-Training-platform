<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" role="img" aria-label="Illustrative mockup of an EDR detection console showing a detection list, a process tree and a response action bar">
  <title>Illustrative EDR detection console (generic mockup)</title>
  <defs>
    <style>
      .bg    { fill: #0b0f1e; }
      .panel { fill: #0a1020; stroke: #1e2d4a; stroke-width: 1; }
      .row   { fill: #0d1526; stroke: #1e2d4a; stroke-width: 1; }
      .sel   { fill: #0e1b30; stroke: #22d3ee; stroke-width: 1; }
      .ui    { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; }
      .mono  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .head  { fill: #cbd5e1; font-size: 12px; font-weight: 700; letter-spacing: .12em; }
      .col   { fill: #64748b; font-size: 10px; font-weight: 600; letter-spacing: .08em; }
      .val   { fill: #e2e8f0; font-size: 12px; }
      .dim   { fill: #94a3b8; font-size: 11px; }
      .crit  { fill: #f87171; font-size: 11px; font-weight: 700; }
      .med   { fill: #fbbf24; font-size: 11px; font-weight: 700; }
      .low   { fill: #38bdf8; font-size: 11px; font-weight: 700; }
      .cyan  { fill: #22d3ee; font-size: 11px; font-weight: 600; }
      .btn   { fill: #11223a; stroke: #22d3ee; stroke-width: 1; }
      .btnT  { fill: #7dd3fc; font-size: 11px; font-weight: 600; }
      .edge  { stroke: #334867; stroke-width: 1.2; fill: none; }
      .cap   { fill: #64748b; font-size: 10px; font-style: italic; }
    </style>
  </defs>

  <rect class="bg" width="940" height="470"/>
  <text class="ui head" x="24" y="28">EDR DETECTION VIEW — WHAT EVERY CONSOLE SHOWS, WHATEVER IT CALLS IT</text>

  <!-- detection list -->
  <rect class="panel" x="24" y="44" width="420" height="196" rx="6"/>
  <text class="ui col" x="38" y="64">SEVERITY</text>
  <text class="ui col" x="110" y="64">HOST</text>
  <text class="ui col" x="220" y="64">TACTIC</text>
  <text class="ui col" x="352" y="64">STATUS</text>

  <rect class="sel" x="34" y="72" width="400" height="34" rx="4"/>
  <text class="ui crit" x="44" y="94">CRITICAL</text>
  <text class="ui val" x="110" y="94">FIN-WKS-014</text>
  <text class="ui val" x="220" y="94">Credential Access</text>
  <text class="ui cyan" x="352" y="94">New</text>

  <rect class="row" x="34" y="112" width="400" height="34" rx="4"/>
  <text class="ui med" x="44" y="134">MEDIUM</text>
  <text class="ui val" x="110" y="134">FIN-WKS-022</text>
  <text class="ui val" x="220" y="134">Execution</text>
  <text class="ui dim" x="352" y="134">In progress</text>

  <rect class="row" x="34" y="152" width="400" height="34" rx="4"/>
  <text class="ui low" x="44" y="174">LOW</text>
  <text class="ui val" x="110" y="174">HR-LAP-008</text>
  <text class="ui val" x="220" y="174">Discovery</text>
  <text class="ui dim" x="352" y="174">Closed</text>

  <rect class="row" x="34" y="192" width="400" height="34" rx="4"/>
  <text class="ui med" x="44" y="214">MEDIUM</text>
  <text class="ui val" x="110" y="214">SRV-APP-03</text>
  <text class="ui val" x="220" y="214">Persistence</text>
  <text class="ui dim" x="352" y="214">In progress</text>

  <!-- process tree -->
  <rect class="panel" x="460" y="44" width="456" height="196" rx="6"/>
  <text class="ui col" x="474" y="64">PROCESS TREE — SELECTED DETECTION</text>

  <text class="mono val" x="482" y="92">explorer.exe</text>
  <path class="edge" d="M492 100 L492 116 L508 116"/>
  <text class="mono val" x="514" y="120">outlook.exe</text>
  <path class="edge" d="M524 128 L524 144 L540 144"/>
  <text class="mono val" x="546" y="148">winword.exe</text>
  <path class="edge" d="M556 156 L556 172 L572 172"/>
  <text class="mono" x="578" y="176" fill="#f87171">powershell.exe</text>
  <text class="ui dim" x="700" y="176">-enc &lt;base64&gt;</text>
  <path class="edge" d="M588 184 L588 200 L604 200"/>
  <text class="mono" x="610" y="204" fill="#f87171">rundll32.exe</text>
  <text class="ui dim" x="716" y="204">-&gt; 203.0.113.44:443</text>

  <text class="ui cap" x="474" y="228">The parent chain is the finding — Word does not normally spawn PowerShell.</text>

  <!-- response bar -->
  <rect class="panel" x="24" y="256" width="892" height="82" rx="6"/>
  <text class="ui col" x="38" y="276">RESPONSE ACTIONS — SAME FOUR EVERYWHERE, DIFFERENT NAMES PER VENDOR</text>

  <rect class="btn" x="38"  y="288" width="118" height="30" rx="4"/>
  <text class="ui btnT" x="60"  y="308">Kill process</text>
  <rect class="btn" x="168" y="288" width="118" height="30" rx="4"/>
  <text class="ui btnT" x="186" y="308">Quarantine file</text>
  <rect class="btn" x="298" y="288" width="150" height="30" rx="4"/>
  <text class="ui btnT" x="312" y="308">Isolate / contain host</text>
  <rect class="btn" x="460" y="288" width="150" height="30" rx="4"/>
  <text class="ui btnT" x="474" y="308">Remote shell session</text>
  <text class="ui dim" x="626" y="308">Isolation preserves memory. Powering off destroys it.</text>

  <!-- vendor naming strip -->
  <rect class="panel" x="24" y="352" width="892" height="98" rx="6"/>
  <text class="ui col" x="38" y="372">THE SAME ACTION, THREE VOCABULARIES</text>
  <text class="ui dim"  x="38"  y="396">Isolate host</text>
  <text class="ui val"  x="180" y="396">Network Containment</text>
  <text class="ui val"  x="420" y="396">Network Quarantine</text>
  <text class="ui val"  x="660" y="396">Device Isolation</text>
  <text class="ui dim"  x="38"  y="420">Remote shell</text>
  <text class="ui val"  x="180" y="420">Real Time Response</text>
  <text class="ui val"  x="420" y="420">Remote Ops</text>
  <text class="ui val"  x="660" y="420">Live Response</text>
  <text class="ui cap"  x="180" y="440">CrowdStrike Falcon</text>
  <text class="ui cap"  x="420" y="440">SentinelOne</text>
  <text class="ui cap"  x="660" y="440">Microsoft Defender for Endpoint</text>
</svg>
