<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 620" role="img" aria-label="Table mapping the five Microsoft Defender products - for Endpoint, for Office 365, for Identity, for Cloud Apps, and for Cloud - to what each protects, the telemetry it generates, and what it does not cover, with a bottom row showing old product names mapped to their new names">
  <title>The Microsoft Defender family — five products, one brand, five different coverage areas</title>
  <defs>
    <style>
      .bg    { fill: #0b0f1e; }
      .panel { fill: #0a1020; stroke: #1e2d4a; stroke-width: 1; }
      .ui    { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; }
      .mono  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; }
      .val   { fill: #e2e8f0; font-size: 11px; }
      .dim   { fill: #64748b; font-size: 10px; }
      .head  { fill: #cbd5e1; font-size: 12px; font-weight: 700; letter-spacing: .12em; }
      .col   { fill: #64748b; font-size: 10px; font-weight: 600; letter-spacing: .06em; }
      .note  { fill: #94a3b8; font-size: 11px; }
      .cyan  { fill: #22d3ee; font-size: 12px; font-weight: 700; }
      .warn  { fill: #fbbf24; font-size: 11px; font-weight: 600; }
      .crit  { fill: #f87171; font-size: 11px; font-weight: 700; }
      .cap   { fill: #64748b; font-size: 10px; font-style: italic; }
    </style>
  </defs>

  <rect class="bg" width="940" height="620"/>
  <text class="ui head" x="24" y="28">ONE BRAND, FIVE PRODUCTS — WHAT EACH DEFENDER ACTUALLY COVERS</text>

  <rect class="panel" x="24" y="44" width="892" height="410" rx="6"/>
  <text class="ui col" x="40" y="66">PRODUCT</text>
  <text class="ui col" x="210" y="66">PROTECTS</text>
  <text class="ui col" x="410" y="66">KEY TELEMETRY</text>
  <text class="ui col" x="640" y="66">DOES NOT COVER</text>
  <line x1="40" y1="76" x2="900" y2="76" stroke="#1e2d4a" stroke-width="1"/>

  <!-- Row 1: MDE -->
  <text class="cyan" x="40" y="100">Defender for Endpoint</text>
  <text class="dim" x="40" y="114">MDE</text>
  <text class="val" x="210" y="100">Workstations &amp; servers</text>
  <text class="mono val" x="410" y="100">DeviceProcessEvents,</text>
  <text class="mono val" x="410" y="116">logon/file/registry events</text>
  <text class="val" x="640" y="100">Email content, SaaS usage,</text>
  <text class="val" x="640" y="116">on-prem AD protocol traffic</text>
  <line x1="40" y1="130" x2="900" y2="130" stroke="#1e2d4a" stroke-width=".5"/>

  <!-- Row 2: MDO -->
  <text class="cyan" x="40" y="154">Defender for Office 365</text>
  <text class="dim" x="40" y="168">MDO</text>
  <text class="val" x="210" y="154">Email &amp; collaboration</text>
  <text class="mono val" x="410" y="154">Safe Links / Safe Attachments</text>
  <text class="mono val" x="410" y="170">detonations, mailbox rule changes</text>
  <text class="val" x="640" y="154">Endpoint process activity,</text>
  <text class="val" x="640" y="170">on-prem AD, cloud workloads</text>
  <line x1="40" y1="184" x2="900" y2="184" stroke="#1e2d4a" stroke-width=".5"/>

  <!-- Row 3: MDI -->
  <text class="cyan" x="40" y="208">Defender for Identity</text>
  <text class="dim" x="40" y="222">MDI</text>
  <text class="val" x="210" y="208">On-prem Active Directory</text>
  <text class="mono val" x="410" y="208">DC traffic: Kerberoasting,</text>
  <text class="mono val" x="410" y="224">DCSync, LDAP recon patterns</text>
  <text class="val" x="640" y="208">Cloud-only identities, endpoint</text>
  <text class="val" x="640" y="224">process telemetry, SaaS OAuth</text>
  <line x1="40" y1="238" x2="900" y2="238" stroke="#1e2d4a" stroke-width=".5"/>

  <!-- Row 4: MCAS -->
  <text class="cyan" x="40" y="262">Defender for Cloud Apps</text>
  <text class="dim" x="40" y="276">MCAS — CASB</text>
  <text class="val" x="210" y="262">SaaS usage (shadow IT,</text>
  <text class="val" x="210" y="278">OAuth consent)</text>
  <text class="mono val" x="410" y="262">Discovered app catalog,</text>
  <text class="mono val" x="410" y="278">risky OAuth grants, session control</text>
  <text class="val" x="640" y="262">Endpoint process activity,</text>
  <text class="val" x="640" y="278">cloud infrastructure posture</text>
  <line x1="40" y1="292" x2="900" y2="292" stroke="#1e2d4a" stroke-width=".5"/>

  <!-- Row 5: Defender for Cloud -->
  <text class="cyan" x="40" y="316">Defender for Cloud</text>
  <text class="dim" x="40" y="330">CSPM + workload protection</text>
  <text class="val" x="210" y="316">Azure / AWS / GCP</text>
  <text class="val" x="210" y="332">infrastructure &amp; posture</text>
  <text class="mono val" x="410" y="316">Misconfig findings, Secure Score</text>
  <text class="mono val" x="410" y="332">recommendations, workload alerts</text>
  <text class="val" x="640" y="316">SaaS usage (not the same as</text>
  <text class="val" x="640" y="332">Cloud Apps!), email, endpoints</text>

  <rect class="panel" x="40" y="352" width="860" height="86" rx="4"/>
  <text class="ui warn" x="56" y="374">DEFENDER XDR IS NOT A SIXTH TELEMETRY SOURCE</text>
  <text class="ui note" x="56" y="394">It is the correlation layer that sits above the four telemetry-producing products (Endpoint, Office 365, Identity,</text>
  <text class="ui note" x="56" y="410">Cloud Apps), stitching their separate alerts into one incident when an attack chain crosses more than one domain.</text>
  <text class="ui note" x="56" y="426">Formerly named Microsoft 365 Defender — same correlation layer, renamed.</text>

  <!-- old vs new names -->
  <rect class="panel" x="24" y="470" width="892" height="128" rx="6"/>
  <text class="ui col" x="40" y="492">SAME PRODUCT, SAME DATA — RENAMES YOU NEED TO RECOGNIZE INSTANTLY</text>

  <text class="dim" x="56" y="522">OLD NAME</text>
  <text class="dim" x="330" y="522">NEW NAME</text>
  <line x1="56" y1="530" x2="860" y2="530" stroke="#1e2d4a" stroke-width=".5"/>

  <text class="mono val" x="56" y="552">Azure Active Directory (Azure AD)</text>
  <text class="mono cyan" x="330" y="552">Entra ID</text>

  <text class="mono val" x="56" y="574">Microsoft 365 Defender</text>
  <text class="mono cyan" x="330" y="574">Defender XDR</text>

  <text class="mono val" x="56" y="596">Azure Sentinel</text>
  <text class="mono cyan" x="330" y="596">Microsoft Sentinel</text>

  <text class="ui cap" x="24" y="616">Same brand, five different engines — misreading which product covers what leads to looking for evidence in the wrong place entirely.</text>
</svg>
