<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-label="The order of volatility for evidence collection, from most volatile like memory to least volatile like backups, and why pulling the power destroys the most valuable evidence first.">
  <title>Order of volatility — collect the most perishable evidence first</title>
  <defs>
    <style>
      .bg{fill:#0b0f1e;} .ui{font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;} .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;}
      .l1{fill:#26100f;stroke:#f87171;stroke-width:1.5;} .l2{fill:#241a06;stroke:#fbbf24;stroke-width:1.5;} .l3{fill:#0e1b30;stroke:#22d3ee;stroke-width:1.5;} .l4{fill:#0e2018;stroke:#22c55e;stroke-width:1.5;}
      .t{fill:#e2e8f0;font-size:12.5px;font-weight:700;} .s{fill:#94a3b8;font-size:10.5px;} .red{fill:#fca5a5;font-size:11px;font-weight:700;}
      .head{fill:#cbd5e1;font-size:12px;font-weight:700;letter-spacing:.05em;} .axis{fill:#64748b;font-size:11px;font-weight:700;}
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="960" height="420"/>
  <text class="ui head" x="30" y="30">ORDER OF VOLATILITY — CAPTURE THE MOST PERISHABLE EVIDENCE FIRST</text>

  <!-- axis -->
  <text class="ui axis" x="40" y="70">MOST</text><text class="ui axis" x="40" y="86">volatile</text>
  <text class="ui axis" x="40" y="352">LEAST</text><text class="ui axis" x="40" y="368">volatile</text>

  <rect class="l1" x="120" y="58" width="560" height="60" rx="8"/>
  <text class="ui t" x="136" y="82" style="fill:#fca5a5">1 · CPU registers, cache, live memory (RAM)</text>
  <text class="ui s" x="136" y="102">running processes, network connections, decryption keys, injected code, fileless malware — gone on power-off</text>

  <rect class="l2" x="120" y="126" width="560" height="56" rx="8"/>
  <text class="ui t" x="136" y="150" style="fill:#fcd34d">2 · Network state + temp files</text>
  <text class="ui s" x="136" y="168">active connections, ARP/routing tables, /tmp — short-lived, changes by the second</text>

  <rect class="l3" x="120" y="190" width="560" height="56" rx="8"/>
  <text class="ui t" x="136" y="214" style="fill:#67e8f9">3 · Disk: files, event logs, registry</text>
  <text class="ui s" x="136" y="232">persists across reboot, but can still be overwritten — image it before you change the host</text>

  <rect class="l4" x="120" y="254" width="560" height="56" rx="8"/>
  <text class="ui t" x="136" y="278" style="fill:#86efac">4 · Backups, archived/forwarded logs, remote data</text>
  <text class="ui s" x="136" y="296">already off the host, durable — least perishable, collect last</text>

  <!-- the power-off warning -->
  <rect class="l1" x="700" y="58" width="236" height="124" rx="10"/>
  <text class="ui red" x="716" y="82">⚠ Pulling the power</text>
  <text class="ui s" x="716" y="104">destroys layers 1 and 2</text>
  <text class="ui s" x="716" y="122">instantly — memory, running</text>
  <text class="ui s" x="716" y="140">processes, live connections,</text>
  <text class="ui s" x="716" y="158">and any in-memory-only</text>
  <text class="ui s" x="716" y="176">(fileless) malware are lost.</text>

  <rect class="l3" x="700" y="192" width="236" height="118" rx="10"/>
  <text class="ui t" x="716" y="216" style="fill:#67e8f9">Chain of custody</text>
  <text class="ui s" x="716" y="238">Record who collected what,</text>
  <text class="ui s" x="716" y="256">when, and how (hash the</text>
  <text class="ui s" x="716" y="274">image). Unbroken custody is</text>
  <text class="ui s" x="716" y="292">what makes evidence hold up</text>
  <text class="ui s" x="716" y="310">in a review or in court.</text>

  <rect class="l4" x="120" y="330" width="816" height="72" rx="10"/>
  <text class="ui head" x="136" y="356">THE TENSION EVERY RESPONDER FEELS</text>
  <text class="ui s" x="136" y="378">Containment (isolate/power-off) can DESTROY the most valuable evidence, while preserving evidence can let the attack CONTINUE.</text>
  <text class="ui s" x="136" y="396">The resolution: <tspan style="fill:#86efac;font-weight:700">network-isolate (not power-off) to freeze the host live</tspan> — you contain the spread AND keep memory intact to capture.</text>
</svg>
