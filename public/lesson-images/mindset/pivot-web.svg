<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-label="How an analyst pivots from a single indicator across different data sources to reconstruct the whole picture of an incident.">
  <title>Pivoting — turning one indicator into the whole picture</title>
  <defs>
    <style>
      .bg{fill:#0b0f1e;} .ui{font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;} .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;}
      .core{fill:#26100f;stroke:#f87171;stroke-width:2;} .node{fill:#0e1b30;stroke:#22d3ee;stroke-width:1.5;}
      .t{fill:#e2e8f0;font-size:12px;font-weight:700;} .s{fill:#94a3b8;font-size:10px;} .src{fill:#64748b;font-size:9.5px;font-style:italic;}
      .edge{stroke:#475569;stroke-width:1.5;fill:none;} .elab{fill:#67e8f9;font-size:9.5px;}
      .head{fill:#cbd5e1;font-size:12px;font-weight:700;letter-spacing:.05em;} .red{fill:#fca5a5;font-size:11px;font-weight:700;}
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="960" height="420"/>
  <text class="ui head" x="30" y="28">ONE INDICATOR → PIVOT ACROSS SOURCES → THE WHOLE PICTURE</text>

  <!-- edges from core -->
  <line class="edge" x1="480" y1="210" x2="230" y2="110"/>
  <line class="edge" x1="480" y1="210" x2="740" y2="105"/>
  <line class="edge" x1="480" y1="210" x2="180" y2="250"/>
  <line class="edge" x1="480" y1="210" x2="770" y2="250"/>
  <line class="edge" x1="480" y1="210" x2="330" y2="360"/>
  <line class="edge" x1="480" y1="210" x2="650" y2="360"/>

  <!-- core -->
  <rect class="core" x="392" y="176" width="176" height="70" rx="10"/>
  <text class="ui red" x="480" y="204" text-anchor="middle">START: one alert</text>
  <text class="ui mono s" x="480" y="224" text-anchor="middle">outbound to 185.4.2.9</text>

  <!-- nodes -->
  <rect class="node" x="120" y="76" width="200" height="66" rx="8"/>
  <text class="ui t" x="136" y="100">Domain(s)</text>
  <text class="ui s" x="136" y="118">what names resolve to it</text>
  <text class="ui src" x="136" y="134">source: passive DNS</text>

  <rect class="node" x="640" y="72" width="210" height="66" rx="8"/>
  <text class="ui t" x="656" y="96">File hashes</text>
  <text class="ui s" x="656" y="114">malware seen talking to it</text>
  <text class="ui src" x="656" y="130">source: EDR / VirusTotal</text>

  <rect class="node" x="70" y="222" width="200" height="66" rx="8"/>
  <text class="ui t" x="86" y="246">Which host</text>
  <text class="ui s" x="86" y="264">internal machine that connected</text>
  <text class="ui src" x="86" y="280">source: firewall / proxy logs</text>

  <rect class="node" x="700" y="220" width="210" height="66" rx="8"/>
  <text class="ui t" x="716" y="244">Other C2 IPs</text>
  <text class="ui s" x="716" y="262">same cert / JA3 fingerprint</text>
  <text class="ui src" x="716" y="278">source: TLS / threat intel</text>

  <rect class="node" x="230" y="336" width="210" height="66" rx="8"/>
  <text class="ui t" x="246" y="360">Which user</text>
  <text class="ui s" x="246" y="378">account active on that host</text>
  <text class="ui src" x="246" y="394">source: auth logs (4624)</text>

  <rect class="node" x="545" y="336" width="220" height="66" rx="8"/>
  <text class="ui t" x="561" y="360">How it got in</text>
  <text class="ui s" x="561" y="378">the process that opened it</text>
  <text class="ui src" x="561" y="394">source: process tree / Sysmon</text>

  <text class="ui elab" x="320" y="150">resolve</text>
  <text class="ui elab" x="600" y="145">files→</text>
  <text class="ui elab" x="300" y="240">who</text>
  <text class="ui elab" x="620" y="240">related</text>

  <text class="ui s" x="30" y="418">Each answer opens the next question: the IP → the host → the user → the process → the files → other IPs. Pivoting is following the thread across sources until the story is whole — every pivot is a new source, not a new guess.</text>
</svg>
